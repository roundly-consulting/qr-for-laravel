name: run-tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.5, 8.6]
        laravel: [13.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: xdebug

      - name: Install dependencies
        run: |
          # Laravel's 13.x releases before 13.32 predate PHP 8.6 (their session handlers miss
          # create_sid()), so a PHP 8.6 job resolves the framework from 13.32.
          composer require --dev "laravel/framework:${{ matrix.php == 8.6 && '^13.32' || matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --coverage --min=90

  # This template ships no migrations and no database access, so the `test-pgsql`
  # real-engine leg every other roundly package carries is deliberately absent — a
  # Postgres service for a suite that never opens a connection is pure cost. Add it back
  # the moment the package gains migrations or touches the database (see the skill's
  # "The test-pgsql real-engine leg" section for the job to copy in).
